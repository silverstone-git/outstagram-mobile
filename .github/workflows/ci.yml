name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build staging APK (debug-signed)
        run: flutter build apk --release --flavor staging --dart-define-from-file=config/staging.json
      - uses: actions/upload-artifact@v4
        with:
          name: outstagram-staging-apk
          path: build/app/outputs/flutter-apk/app-staging-release.apk
          retention-days: 14
